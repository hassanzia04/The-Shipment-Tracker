server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # When deployed behind the OCI load balancer (TLS terminated at LB), redirect
    # any plain-HTTP request to HTTPS. The LB sets X-Forwarded-Proto on every request.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                            always;
    add_header X-Frame-Options         "DENY"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Proxy API calls to the backend service.
    # Strips the /api prefix so backend routes remain unchanged.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # SPA: serve index.html for any route not matched by a real file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
